[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "orca-collision-avoidance"
version = "1.0.0"
description = "Optimal Reciprocal Collision Avoidance for many robots, with the incremental linear programs and a test of ORCA's guarantee."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mahim Trivedi" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "matplotlib>=3.8",
]
keywords = ["orca", "collision-avoidance", "multi-robot", "velocity-obstacles", "linear-programming", "robotics", "python"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.15", "mypy>=1.10", "scipy>=1.11"]

[project.urls]
Homepage = "https://github.com/robofan45/orca-collision-avoidance"
Repository = "https://github.com/robofan45/orca-collision-avoidance"
Issues = "https://github.com/robofan45/orca-collision-avoidance/issues"
Collection = "https://github.com/robofan45/Python-Robotics-Projects"

[project.scripts]
orca-collision-avoidance = "orca_collision_avoidance.orca:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
filterwarnings = ["error"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E", "W", "UP"]
ignore = ["E501", "E741", "E402"]

[tool.mypy]
ignore_missing_imports = true
